# What this fork does with its own changes: test them, prove they still exist, and build
# the images this installation runs.
#
# Upstream's test workflows for the areas this fork changes are CALLED from here, so the
# images are gated on exactly what upstream runs on a pull request. The rest of upstream's
# workflows are disabled through the API rather than renamed -- several of them publish,
# to PyPI, Docker Hub and GitHub Pages, and one of them on another fork here cut a
# release and moved the base tag onto a fork commit. A rename only takes effect on refs
# that carry it, and a tag does not.
#
# The images are built here with the standard actions rather than through the
# organisation's shared image-build workflow. That workflow lives in a PRIVATE
# repository, and GitHub will not resolve a private reusable workflow from a public
# caller whatever `actions/permissions/access` says -- measured: "workflow was not
# found". This repository is public because a fork of a public repository cannot be
# anything else. The shared workflow exists to carry a daemonless buildah build onto
# runners with no Docker; these are GitHub-hosted runners, which have one, so nothing is
# being duplicated here -- the two solve different problems.
name: wm-ci

on:
  workflow_dispatch:
    inputs:
      upstream_base:
        # For proving a rebuilt branch before the tag moves: the gates compare against
        # this ref instead. Push and pull-request runs always use the tag.
        description: The upstream commit or ref the two fork gates compare against
        required: false
        default: upstream-base
  pull_request:
    branches: [wm]
  push:
    branches: [wm]

# Read-only by default. The image job raises its own to packages: write, so the test
# jobs run with a token that cannot publish anything.
# Third-party actions are pinned to commit SHAs, not tags. The image job holds a token
# that can publish to the organisation's registry, and a tag is a mutable pointer: an
# upstream tag moved onto different code would run that code with those credentials.
permissions:
  contents: read

concurrency:
  group: wm-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  UPSTREAM_BASE: ${{ inputs.upstream_base || 'upstream-base' }}

jobs:
  # The three sets that describe this fork's changes must agree. A rebase that silently
  # dropped one is the failure; see hack/wm-check.sh.
  changes-are-accounted-for:
    runs-on: ubuntu-latest
    # A bound, not an estimate: GitHub's default is six hours of a held runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The check walks upstream-base..HEAD, so it needs the history and the tag.
          fetch-depth: 0
      - run: hack/wm-check.sh

  # Upstream's own test workflows for every area this fork changes, called rather than
  # copied. A copy is a second step list that loses coverage without saying so, and one
  # did: it had dropped the mitmscript tests and the nft regression from egress, gofmt
  # and golangci-lint from the controller, the coverage floor and the Windows leg from
  # the server, and the chart-docs drift check -- the check the WM-6 chart change was
  # already failing. Each is also what upstream will run on the change when it is sent.
  egress-tests:
    uses: ./.github/workflows/egress-test.yml
    permissions:
      contents: read
      pull-requests: read

  execd-tests:
    uses: ./.github/workflows/execd-test.yml
    permissions:
      contents: read
      pull-requests: read

  kubernetes-tests:
    uses: ./.github/workflows/kubernetes-test.yml
    permissions:
      contents: read
      pull-requests: read

  server-tests:
    uses: ./.github/workflows/server-test.yml
    permissions:
      contents: read
      pull-requests: read

  chart-docs:
    uses: ./.github/workflows/helm-docs.yml
    permissions:
      contents: read
      pull-requests: read

  # WM-6 in the chart, which upstream's chart checks cannot know about. The Go tests
  # prove the controller applies the flag; nothing there sees a chart that stops passing
  # the value, which leaves every controller cluster-wide with the Go tests green.
  # Checked both ways: rendered when set, and absent by default.
  controller-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the chart passes watchNamespaces to the controller
        run: |
          set -euo pipefail
          chart=manifests/charts/controller
          # Rendered into a variable first: under pipefail, `helm template | grep -q`
          # fails with helm's SIGPIPE whenever grep stops reading before helm is done.
          set_=$(helm template t "$chart" --set 'controller.watchNamespaces={sandbox-a,sandbox-b}')
          unset_=$(helm template t "$chart")
          grep -qE -- '^[[:space:]]*- --watch-namespaces=sandbox-a,sandbox-b$' <<<"$set_" \
            || { echo "the chart did not render --watch-namespaces=sandbox-a,sandbox-b"; exit 1; }
          if grep -q -- '--watch-namespaces' <<<"$unset_"; then
            echo "the chart renders --watch-namespaces with nothing set"; exit 1
          fi
          echo "rendered when set, absent by default"

  # Every WM test must FAIL against the unmodified tree. One that passes there is either
  # a change upstream has absorbed -- in which case the commit should be dropped -- or a
  # test that asserts nothing. Both are worth a red build.
  tests-fail-without-the-changes:
    runs-on: ubuntu-latest
    # About 4 minutes measured; the bound also covers uv sync and go's module fetch on a
    # stalled registry, which have no deadline of their own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.9'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: pip install uv
      # The gates' own classifiers, against inputs whose answer is known, before the gate
      # that relies on them.
      - run: hack/wm-gates-selftest.sh
      - name: Prepare real API assets for controller behavior proof
        run: |
          make -C kubernetes setup-envtest
          echo "KUBEBUILDER_ASSETS=$(pwd)/$(find kubernetes/bin/k8s -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"
      - run: hack/wm-fail-on-base.sh

  images:
    needs:
      - changes-are-accounted-for
      - egress-tests
      - execd-tests
      - kubernetes-tests
      - server-tests
      - chart-docs
      - controller-chart
      - tests-fail-without-the-changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: server
            dockerfile: server/Dockerfile
          - name: egress
            context: .
            dockerfile: components/egress/Dockerfile
          - name: execd
            context: .
            dockerfile: components/execd/Dockerfile
          - name: controller
            context: kubernetes
            dockerfile: kubernetes/Dockerfile
          - name: ingress-gateway
            context: .
            dockerfile: components/ingress/Dockerfile
          # kubernetes/Dockerfile builds whichever binary PACKAGE names, so the
          # task-executor shares the controller's Dockerfile and differs only in
          # its build arguments. Both values are taken from kubernetes/build.sh,
          # which is what publish-components.yml runs upstream: USERID=0 because
          # the task-executor runs as root inside the sandbox pod, unlike the
          # controller's 65532.
          - name: task-executor
            context: kubernetes
            dockerfile: kubernetes/Dockerfile
            build-args: |
              PACKAGE=cmd/task-executor/main.go
              USERID=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/wm' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/wide-moat/opensandbox-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Pushed only from the branch the images are built from. A pull request builds
          # and discards, which still proves the Dockerfile works.
          push: ${{ github.ref == 'refs/heads/wm' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # matrix.build-args is empty for every entry that does not set it, and an
          # empty line adds nothing, so the existing images are built exactly as
          # before.
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The digest is what an installation pins. A tag is a convenience that can be
      # moved; the digest is the record of what was actually built.
      - name: the digest to pin
        if: steps.build.outputs.digest != ''
        run: |
          echo "ghcr.io/wide-moat/opensandbox-${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # The CRDs as a Helm chart, oci://ghcr.io/wide-moat/charts/opensandbox-crds, at
  # <controller chart version>-g<sha7>. An installation of the Wide Moat platform used to
  # apply kubernetes/config/crd/bases straight from this repository at the branch `wm` -- a
  # source that moves, and one a buyer installing from a release would have to reach GitHub
  # to read. The platform's release now pins this chart instead. hack/wm-crds-chart.sh says
  # what is packaged and why nothing of the chart is committed.
  #
  # Gated on the same jobs as the images, so a chart exists for exactly the commits whose
  # images exist. A pull request packages, compares with the source and asks the registry
  # whether the version exists (--probe) -- the lookup a push depends on, exercised before
  # wm needs it. Only wm pushes, and never over a version that is already there.
  #
  # PUBLIC, like every image this repository publishes and like the upstream chart the
  # platform already consumes (computer-use-server): it is the content of a public
  # Apache-2.0 repository, so private would hide nothing -- and would cost a per-package
  # "Manage Actions access" grant for every repository that reads it with its own token.
  # Asserted after every push, because anyone with admin on the package can change it.
  crds-chart:
    needs:
      - changes-are-accounted-for
      - egress-tests
      - execd-tests
      - kubernetes-tests
      - server-tests
      - chart-docs
      - controller-chart
      - tests-fail-without-the-changes
    runs-on: ubuntu-latest
    # Seconds of work. Anything near this is a stalled registry holding a runner.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      REPOSITORY: oci://ghcr.io/wide-moat/charts
      PUBLISH: ${{ github.ref == 'refs/heads/wm' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The helm the Wide Moat platform packages its own charts with.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      # Checked against the release's own checksums.txt before it is unpacked: this binary is
      # handed the registry credential.
      - name: install crane
        run: |
          set -euo pipefail
          # Sums from go-containerregistry v0.20.2 checksums.txt.
          case "$(uname -m)" in
            x86_64)        arch=x86_64; sum=c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b ;;
            aarch64|arm64) arch=arm64;  sum=aff0db48825124c9331ea310057214bd4e92c01aa2e414d539e9659841d9422a ;;
            *) echo "::error::no crane checksum for architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSL --fail --retry 5 --retry-all-errors --connect-timeout 10 --max-time 120 -o "$RUNNER_TEMP/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_${arch}.tar.gz"
          echo "$sum  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/bin" crane
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: the publisher can still refuse
        run: hack/wm-crds-chart-selftest.sh

      # crane on every event: the pull request's --probe reads the registry too. helm only where
      # it pushes and pulls. --password-stdin: argv is visible through ps.
      - name: log in to GHCR
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | crane auth login ghcr.io -u "$ACTOR" --password-stdin
          if [ "$PUBLISH" = true ]; then
            printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          fi

      - name: package, compare with the source, and on wm publish and read back
        run: |
          set -euo pipefail
          mode=--probe; [ "$PUBLISH" = true ] && mode=--push
          # GITHUB_SHA cut to seven rather than `git rev-parse --short`, which grows when seven
          # characters are ambiguous. On a pull request it is the merge commit: nothing is pushed.
          hack/wm-crds-chart.sh "${GITHUB_SHA:0:7}" "$REPOSITORY" "$RUNNER_TEMP/published.txt" "$mode"
          {
            echo "### opensandbox-crds ($mode)"
            echo
            echo "\`$REPOSITORY\` -- name, version, digest (\`-\` where nothing was published)"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/published.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      # Read from the API rather than assumed. On a pull request nothing was pushed, so a package
      # that does not exist yet is allowed -- only when the registry agrees it is absent.
      - name: the package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          allow=--allow-absent; [ "$PUBLISH" = true ] && allow=""
          hack/wm-package-visibility.sh "$OWNER" "$REPOSITORY/opensandbox-crds" public $allow
