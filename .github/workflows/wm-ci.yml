# What this fork does with its own changes: test them, prove they still exist, and build
# the images this installation runs.
#
# Upstream's own 25 workflows are disabled through the API rather than renamed -- several
# of them publish, to PyPI, Docker Hub and GitHub Pages, and one of them on another fork
# here cut a release and moved the base tag onto a fork commit. A rename only takes
# effect on refs that carry it, and a tag does not.
#
# The images are built here with the standard actions rather than through the
# organisation's shared image-build workflow. That workflow lives in a PRIVATE
# repository, and GitHub will not resolve a private reusable workflow from a public
# caller whatever `actions/permissions/access` says -- measured: "workflow was not
# found". This repository is public because a fork of a public repository cannot be
# anything else. The shared workflow exists to carry a daemonless buildah build onto
# runners with no Docker; these are GitHub-hosted runners, which have one, so nothing is
# being duplicated here -- the two solve different problems.
name: wm-ci

on:
  workflow_dispatch:
  pull_request:
    branches: [wm]
  push:
    branches: [wm]

# Read-only by default. The image job raises its own to packages: write, so the test
# jobs run with a token that cannot publish anything.
permissions:
  contents: read

concurrency:
  group: wm-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # The three sets that describe this fork's changes must agree. A rebase that silently
  # dropped one is the failure; see hack/wm-check.sh.
  changes-are-accounted-for:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check walks upstream-base..HEAD, so it needs the history and the tag.
          fetch-depth: 0
      - run: hack/wm-check.sh

  egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: components/egress/go.sum
      - name: gofmt
        working-directory: components/egress
        run: |
          files="$(gofmt -l . ../internal)"
          [ -z "$files" ] || { echo "$files"; exit 1; }
      - working-directory: components/egress
        run: go vet ./...
      - working-directory: components/egress
        run: go test ./...

  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: kubernetes/go.sum
      - working-directory: kubernetes
        run: go vet ./...
      # `make test`, not a bare `go test`: the controller suite runs against envtest, and
      # that target is what downloads the kube-apiserver and etcd binaries it needs.
      # Without them the suite fails in BeforeSuite -- on unmodified upstream too, so it
      # is a missing dependency rather than anything this fork changed.
      - working-directory: kubernetes
        run: make test

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install uv
      - working-directory: server
        run: uv sync
      - working-directory: server
        run: uv run ruff check .
      - working-directory: server
        run: uv run pytest tests/ -q

  # Every WM test must FAIL against the unmodified tree. One that passes there is either
  # a change upstream has absorbed -- in which case the commit should be dropped -- or a
  # test that asserts nothing. Both are worth a red build.
  tests-fail-without-the-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install uv
      - run: hack/wm-fail-on-base.sh

  images:
    needs: [changes-are-accounted-for, egress, controller, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: server
            dockerfile: server/Dockerfile
          - name: egress
            context: .
            dockerfile: components/egress/Dockerfile
          - name: execd
            context: .
            dockerfile: components/execd/Dockerfile
          - name: controller
            context: kubernetes
            dockerfile: kubernetes/Dockerfile
          - name: ingress-gateway
            context: .
            dockerfile: components/ingress/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/wm' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wide-moat/opensandbox-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Pushed only from the branch the images are built from. A pull request builds
          # and discards, which still proves the Dockerfile works.
          push: ${{ github.ref == 'refs/heads/wm' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The digest is what an installation pins. A tag is a convenience that can be
      # moved; the digest is the record of what was actually built.
      - name: the digest to pin
        if: steps.build.outputs.digest != ''
        run: |
          echo "ghcr.io/wide-moat/opensandbox-${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"
