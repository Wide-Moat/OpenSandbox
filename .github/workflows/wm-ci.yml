# What this fork does with its own changes: test them, prove they still exist, and build
# the images this installation runs.
#
# Upstream's test workflows for the areas this fork changes are CALLED from here, so the
# images are gated on exactly what upstream runs on a pull request. The rest of upstream's
# workflows are disabled through the API rather than renamed -- several of them publish,
# to PyPI, Docker Hub and GitHub Pages, and one of them on another fork here cut a
# release and moved the base tag onto a fork commit. A rename only takes effect on refs
# that carry it, and a tag does not.
#
# The images are built here with the standard actions rather than through the
# organisation's shared image-build workflow. That workflow lives in a PRIVATE
# repository, and GitHub will not resolve a private reusable workflow from a public
# caller whatever `actions/permissions/access` says -- measured: "workflow was not
# found". This repository is public because a fork of a public repository cannot be
# anything else. The shared workflow exists to carry a daemonless buildah build onto
# runners with no Docker; these are GitHub-hosted runners, which have one, so nothing is
# being duplicated here -- the two solve different problems.
name: wm-ci

on:
  workflow_dispatch:
    inputs:
      upstream_base:
        # For proving a rebuilt branch before the tag moves: the gates compare against
        # this ref instead. Push and pull-request runs always use the tag.
        description: The upstream commit or ref the two fork gates compare against
        required: false
        default: upstream-base
  pull_request:
    branches: [wm]
  push:
    branches: [wm]

# Read-only by default. The image job raises its own to packages: write, so the test
# jobs run with a token that cannot publish anything.
# Third-party actions are pinned to commit SHAs, not tags. The image job holds a token
# that can publish to the organisation's registry, and a tag is a mutable pointer: an
# upstream tag moved onto different code would run that code with those credentials.
permissions:
  contents: read

concurrency:
  group: wm-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  UPSTREAM_BASE: ${{ inputs.upstream_base || 'upstream-base' }}

jobs:
  # The three sets that describe this fork's changes must agree. A rebase that silently
  # dropped one is the failure; see hack/wm-check.sh.
  changes-are-accounted-for:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The check walks upstream-base..HEAD, so it needs the history and the tag.
          fetch-depth: 0
      - run: hack/wm-check.sh

  # Upstream's own test workflows for every area this fork changes, called rather than
  # copied. A copy is a second step list that loses coverage without saying so, and one
  # did: it had dropped the mitmscript tests and the nft regression from egress, gofmt
  # and golangci-lint from the controller, the coverage floor and the Windows leg from
  # the server, and the chart-docs drift check -- the check the WM-6 chart change was
  # already failing. Each is also what upstream will run on the change when it is sent.
  egress-tests:
    uses: ./.github/workflows/egress-test.yml
    permissions:
      contents: read
      pull-requests: read

  execd-tests:
    uses: ./.github/workflows/execd-test.yml
    permissions:
      contents: read
      pull-requests: read

  kubernetes-tests:
    uses: ./.github/workflows/kubernetes-test.yml
    permissions:
      contents: read
      pull-requests: read

  server-tests:
    uses: ./.github/workflows/server-test.yml
    permissions:
      contents: read
      pull-requests: read

  chart-docs:
    uses: ./.github/workflows/helm-docs.yml
    permissions:
      contents: read
      pull-requests: read

  # WM-6 in the chart, which upstream's chart checks cannot know about. The Go tests
  # prove the controller applies the flag; nothing there sees a chart that stops passing
  # the value, which leaves every controller cluster-wide with the Go tests green.
  # Checked both ways: rendered when set, and absent by default.
  controller-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the chart passes watchNamespaces to the controller
        run: |
          set -euo pipefail
          chart=manifests/charts/controller
          helm template t "$chart" --set 'controller.watchNamespaces={sandbox-a,sandbox-b}' \
            | grep -qE -- '^[[:space:]]*- --watch-namespaces=sandbox-a,sandbox-b$' \
            || { echo "the chart did not render --watch-namespaces=sandbox-a,sandbox-b"; exit 1; }
          if helm template t "$chart" | grep -q -- '--watch-namespaces'; then
            echo "the chart renders --watch-namespaces with nothing set"; exit 1
          fi
          echo "rendered when set, absent by default"

  # Every WM test must FAIL against the unmodified tree. One that passes there is either
  # a change upstream has absorbed -- in which case the commit should be dropped -- or a
  # test that asserts nothing. Both are worth a red build.
  tests-fail-without-the-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.9'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: pip install uv
      # The gates' own classifiers, against inputs whose answer is known, before the gate
      # that relies on them.
      - run: hack/wm-gates-selftest.sh
      - run: hack/wm-fail-on-base.sh

  images:
    needs:
      - changes-are-accounted-for
      - egress-tests
      - execd-tests
      - kubernetes-tests
      - server-tests
      - chart-docs
      - controller-chart
      - tests-fail-without-the-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: server
            dockerfile: server/Dockerfile
          - name: egress
            context: .
            dockerfile: components/egress/Dockerfile
          - name: execd
            context: .
            dockerfile: components/execd/Dockerfile
          - name: controller
            context: kubernetes
            dockerfile: kubernetes/Dockerfile
          - name: ingress-gateway
            context: .
            dockerfile: components/ingress/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/wm' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/wide-moat/opensandbox-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Pushed only from the branch the images are built from. A pull request builds
          # and discards, which still proves the Dockerfile works.
          push: ${{ github.ref == 'refs/heads/wm' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The digest is what an installation pins. A tag is a convenience that can be
      # moved; the digest is the record of what was actually built.
      - name: the digest to pin
        if: steps.build.outputs.digest != ''
        run: |
          echo "ghcr.io/wide-moat/opensandbox-${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"
