{{- if or .Values.controller.podRecovery .Values.controller.endedSandboxGrace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags
  labels:
    {{- include "opensandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-manager
data:
  {{- with .Values.controller.endedSandboxGrace }}
  ended-sandbox-grace: {{ . | quote }}
  {{- end }}
  {{- with .Values.controller.podRecovery }}
  {{- with .stuckThreshold }}
  pod-recovery-stuck-threshold: {{ . | quote }}
  {{- end }}
  {{- with .maxAttempts }}
  pod-recovery-max-attempts: {{ . | quote }}
  {{- end }}
  {{- with .admissionReasons }}
  pod-recovery-admission-reasons: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
